<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Adriel Antonio Silva Hernández — Software Developer · Linux · Local AI · Automation">
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#0d9488"/></linearGradient>
    <radialGradient id="glow" cx=".85" cy="0" r=".7"><stop offset="0" stop-color="#0d9488" stop-opacity=".12"/><stop offset="1" stop-color="#0d9488" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx="0" cy=".2" r=".6"><stop offset="0" stop-color="#4f46e5" stop-opacity=".12"/><stop offset="1" stop-color="#4f46e5" stop-opacity="0"/></radialGradient>
    <clipPath id="r"><rect width="1200" height="340" rx="18"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Inter, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace; font-size: 16px; }
    .fade { opacity: 0; animation: fade .8s ease forwards; }
    .type { animation-name: type; animation-timing-function: steps(20, end); animation-fill-mode: forwards; }
    .res { opacity: 0; animation: fade .3s ease forwards; }
    .caret { animation: blink 1s steps(1) infinite; }
    .dot { animation: pulse 2s ease-in-out infinite; transform-origin: 66px 62px; }
    @keyframes type { from { transform: translateX(0); } to { transform: translateX(var(--w)); } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 50% { opacity: .4; } }
    @media (prefers-reduced-motion: reduce) { .fade, .res { opacity: 1; animation: none; } .type { display: none; } .caret, .dot { animation: none; } }
  </style>
  <g clip-path="url(#r)">
    <rect width="1200" height="340" fill="#f7f8fb"/>
    <rect width="1200" height="340" fill="url(#glow)"/>
    <rect width="1200" height="340" fill="url(#glow2)"/>
    <rect x=".5" y=".5" width="1199" height="339" rx="18" fill="none" stroke="#e4e7ef"/>

    <g class="fade">
      <rect x="52" y="48" width="330" height="28" rx="14" fill="#ffffff" stroke="#e4e7ef"/>
      <circle class="dot" cx="70" cy="62" r="4.5" fill="#22c55e"/>
      <text x="84" y="67" class="sans" font-size="13.5" fill="#5a6275">Available — remote · on-site · contract</text>
    </g>
    <g class="fade" style="animation-delay:.15s">
      <text x="52" y="142" class="sans" font-size="50" font-weight="800" fill="#141824" letter-spacing="-1.5">Adriel Antonio</text>
      <text x="52" y="198" class="sans" font-size="50" font-weight="800" fill="url(#g)" letter-spacing="-1.5">Silva Hernández</text>
    </g>
    <g class="fade" style="animation-delay:.35s">
      <text x="54" y="246" class="sans" font-size="19" fill="#5a6275">Software Developer · Linux · Local AI · Automation</text>
      <text x="54" y="276" class="sans" font-size="19" fill="#5a6275">Python · C++ · Bash · Databases</text>
      <rect x="54" y="296" width="120" height="4" rx="2" fill="url(#g)"/>
    </g>

    <g class="fade" style="animation-delay:.2s">
      <rect x="730" y="40" width="420" height="260" rx="14" fill="#0f131c"/>
      <rect x="730" y="40" width="420" height="40" rx="14" fill="#ffffff" fill-opacity=".04"/>
      <circle cx="754" cy="60" r="6" fill="#ff5f57"/><circle cx="774" cy="60" r="6" fill="#febc2e"/><circle cx="794" cy="60" r="6" fill="#28c840"/>
      <text x="814" y="65" class="mono" font-size="12.5" fill="#7d8799" style="font-size:12.5px">adriel@fedora: ~</text>
      
    <text x="752" y="114" class="mono"><tspan fill="#2dd4bf">$ </tspan><tspan fill="#d6deeb">whoami</tspan></text>
    <rect x="770" y="99" width="64" height="21" fill="#0f131c" class="type" style="animation-delay:0.40s;animation-duration:0.42s;--w:64px"/>
    <text x="752" y="138" class="mono res" fill="#8b95a8" style="animation-delay:0.97s">adriel — developer · Bayamón, PR</text>
    <text x="752" y="170" class="mono"><tspan fill="#2dd4bf">$ </tspan><tspan fill="#d6deeb">cat stack.txt</tspan></text>
    <rect x="770" y="155" width="132" height="21" fill="#0f131c" class="type" style="animation-delay:1.42s;animation-duration:0.91s;--w:132px"/>
    <text x="752" y="194" class="mono res" fill="#8b95a8" style="animation-delay:2.48s">python  c++  bash  sql  linux</text>
    <text x="752" y="226" class="mono"><tspan fill="#2dd4bf">$ </tspan><tspan fill="#d6deeb">alias</tspan></text>
    <rect x="770" y="211" width="54" height="21" fill="#0f131c" class="type" style="animation-delay:2.93s;animation-duration:0.35s;--w:54px"/>
    <text x="752" y="250" class="mono res" fill="#8b95a8" style="animation-delay:3.43s">vim=nvim  cv=nvim+claude  codium</text>
      <text x="752" y="282" class="mono"><tspan fill="#2dd4bf">$ </tspan><tspan class="caret" fill="#2dd4bf">▍</tspan></text>
    </g>
  </g>
</svg>
